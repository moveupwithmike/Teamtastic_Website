name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Strict TypeScript migration gate
        run: npm run typecheck:strict
      # Informational only — no coverage thresholds are configured, and a
      # failure here must never fail the job. Point people at the risk-ranked
      # gap list from the code review, not a percentage.
      - name: Coverage report (informational)
        continue-on-error: true
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  edge-functions-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # supabase/functions/*/index.ts is excluded from tsconfig.json's include
      # (it's a separate Deno runtime, not part of the Next.js app), so it
      # gets no type-checking from `npm run check` — this is the only gate
      # that covers it. Each function has its own deno.json, so check them
      # individually from their own directory rather than as one glob.
      - name: Type-check Supabase Edge Functions
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            [ -f "$dir/index.ts" ] || continue
            echo "::group::$name"
            (cd "$dir" && deno check index.ts)
            echo "::endgroup::"
          done
      - name: Test Supabase Edge Functions
        run: npm run test:edge

  database-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Start isolated Supabase database
        run: supabase db start
      - name: Apply migrations and run game RPC hardening regression
        run: supabase test db supabase/tests/game_rpc_hardening.sql
